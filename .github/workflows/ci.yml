name: IT Incident RAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          RAG_API_KEY: "ci-test-key-not-for-production"
        run: python -m pytest tests/ -v

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Build FastAPI Docker image
        run: docker build -f Dockerfile.api -t it-incident-rag-api:ci .

      - name: Build Streamlit Docker image
        run: docker build -f Dockerfile.streamlit -t it-incident-rag-streamlit:ci .
